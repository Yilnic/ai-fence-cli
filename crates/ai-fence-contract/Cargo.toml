[package]
name = "ai-fence-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared DTOs for AI Context Fence gateway APIs"
repository = "https://github.com/Yilnic/ai-fence-cli"
readme = "../../README.md"
keywords = ["ai", "proxy", "gateway", "dto"]
categories = ["web-programming"]

[dependencies]
chrono = { version = "=0.4.42", features = ["serde"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
