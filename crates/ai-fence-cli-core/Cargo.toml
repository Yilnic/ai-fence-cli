[package]
name = "ai-fence-cli-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Launcher-side configuration and authentication for AI Context Fence"
repository = "https://github.com/Yilnic/ai-fence-cli"
readme = "../../README.md"
keywords = ["ai", "cli", "proxy", "security"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
ai-fence-contract = { path = "../ai-fence-contract" }
ai-fence-model-metadata = { path = "../ai-fence-model-metadata" }
actix-web = "=4.13.0"
actix-http = "=3.13.5"
actix-ws = "=0.4.0"
anyhow = "=1.0.100"
bytes = "=1.11.1"
chrono = "=0.4.42"
clap = { version = "=4.5.53", features = ["derive"] }
dirs = "=6.0.0"
futures = "=0.3.31"
fs2 = "=0.4.3"
libc = "=0.2.186"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tokio = { version = "=1.50.0", features = ["full"] }
tokio-tungstenite = { version = "=0.26.2", features = ["rustls-tls-webpki-roots"] }
toml = "=0.8.23"
tracing = "=0.1.43"
uuid = { version = "=1.19.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.23.0"
