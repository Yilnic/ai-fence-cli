[package]
name = "ai-fence-model-metadata"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared model capability and pricing metadata for AI Context Fence"
repository = "https://github.com/Yilnic/ai-fence-cli"
readme = "../../README.md"
keywords = ["ai", "models", "metadata"]
categories = ["data-structures"]

[dependencies]
once_cell = "=1.21.3"
reqwest = { version = "=0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
