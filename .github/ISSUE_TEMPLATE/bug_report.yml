name: CLI bug
description: Report a reproducible CLI or public-workspace defect using synthetic data.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, provider auth files, request payloads, proprietary source, protocol diffs, or sensitive logs. Use private vulnerability reporting for security issues.
  - type: input
    id: cli-version
    attributes:
      label: AI Fence CLI version
      description: Output of `ai-fence-cli --version`.
      placeholder: ai-fence-cli 0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, version, and CPU architecture.
      placeholder: Ubuntu 24.04, x86-64
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Native tool
      description: Tool name and version, such as Codex or Claude Code.
      placeholder: codex-cli 0.145.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Free standalone
        - Managed gateway
        - Self-hosted gateway
        - Public Rust workspace only
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Minimal commands or steps using only synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized error text if relevant.
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Public-data confirmation
      options:
        - label: I removed credentials, private payloads, proprietary source, protocol diffs, and sensitive logs.
          required: true
        - label: This is not a security vulnerability.
          required: true
