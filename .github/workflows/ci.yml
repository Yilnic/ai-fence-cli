name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s tests -p 'test_release.py'
      - run: python3 -B -m unittest discover -s crates/ai-fence-cli-core/tests/desktop -v
      - run: ./scripts/check-boundary.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - id: cargo_tests
        run: |
          set -o pipefail
          cargo test --workspace --locked -- --test-threads=4 2>&1 | tee "$RUNNER_TEMP/ai-fence-rust-tests.log"
      - name: Report failed Rust tests
        if: failure() && steps.cargo_tests.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = Path(os.environ["RUNNER_TEMP"]) / "ai-fence-rust-tests.log"
          ansi = re.compile(r"\x1b\[[0-9;]*[A-Za-z]")
          for line in log.read_text(errors="replace").splitlines():
              match = re.fullmatch(r"test ([A-Za-z0-9_:]+) \.\.\. FAILED", ansi.sub("", line))
              if match:
                  print("::error::Rust test failed: " + match[1])
          PY
      - run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - run: cargo build --locked -p ai-fence-cli-core --bin ai-fence-workspace
      - run: python3 scripts/test-workspace-shells.py --helper target/debug/ai-fence-workspace

  windows-shells:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p ai-fence-cli-core --bin ai-fence-workspace
      - run: python scripts/test-workspace-shells.py --helper target/debug/ai-fence-workspace.exe
