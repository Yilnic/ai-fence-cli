image: rust:1.94.0-bookworm

stages: [test]

cache:
  key: cargo
  paths:
    - target/
    - .cargo/

public-workspace:
  stage: test
  script:
    - rustup component add clippy rustfmt
    - ./scripts/check-boundary.sh
    - cargo fmt --all --check
    - cargo clippy --workspace --all-targets --locked -- -D warnings
    - cargo test --workspace --locked -- --test-threads=4
